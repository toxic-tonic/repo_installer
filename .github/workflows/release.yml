# Builds the GitHub release for a tag v* that arrived through the Forgejo
# push mirror. Same build as on Forgejo (scripts/build_zip.py), so both
# releases carry the same SHA-256. Never commits or pushes: the mirror owns
# the repository content.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    name: GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release, nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check tag against manifest.json and CHANGELOG.md
        id: meta
        run: |
          version="$(python3 scripts/release_meta.py check "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python3 scripts/release_meta.py prerelease "$version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists, it is never overwritten."
            exit 1
          fi

      - name: Build ZIP (deterministic)
        id: build
        run: |
          python3 scripts/build_zip.py --ref HEAD --out dist | tee build.txt
          echo "sha256=$(head -n1 build.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -c <(sed "s#  dist/#  #" ../build.txt))

      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release_meta.py notes "${{ steps.meta.outputs.version }}" \
            "${{ steps.build.outputs.sha256 }}" > notes.md
          cat notes.md

      - name: Publish release
        run: |
          flags=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            "${flags[@]}"
