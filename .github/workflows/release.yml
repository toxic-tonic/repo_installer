# Builds the GitHub release for a tag v* that arrived through the Forgejo
# push mirror. Same build as on Forgejo (scripts/build_zip.py), so both
# releases carry the same SHA-256. Never commits or pushes: the mirror owns
# the repository content.
#
# Manual start (Actions → Release → Run workflow, tag e.g. v0.2.0) catches up
# when the push created no tag event; GitHub sends none when more than three
# tags are pushed at once, e.g. on the first mirror sync. Same checks either
# way. Tags whose commit has no release workflow (v0.1.0, v0.1.1) are refused.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      skip_tests: true

  release:
    name: GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release, nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Tag must carry this release workflow
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::'$TAG' is not a version tag (v<version>)."
            exit 1
          fi
          if [[ ! -f .github/workflows/release.yml || ! -f scripts/build_zip.py ]]; then
            echo "::error::$TAG predates the GitHub release workflow and is not rebuilt."
            exit 1
          fi

      - name: Check tag against manifest.json and CHANGELOG.md
        id: meta
        run: |
          version="$(python3 scripts/release_meta.py check "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(python3 scripts/release_meta.py prerelease "$version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists, it is never overwritten."
            exit 1
          fi

      - name: Build ZIP (deterministic)
        id: build
        run: |
          python3 scripts/build_zip.py --ref HEAD --out dist | tee build.txt
          echo "sha256=$(head -n1 build.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -c <(sed "s#  dist/#  #" ../build.txt))

      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release_meta.py notes "${{ steps.meta.outputs.version }}" \
            "${{ steps.build.outputs.sha256 }}" > notes.md
          cat notes.md

      - name: Publish release
        run: |
          flags=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            "${flags[@]}"
